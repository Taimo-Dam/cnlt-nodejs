<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng Dụng Chat Realtime</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="chat-container">
        <!-- Join Chat Section -->
        <div id="joinSection" class="join-section active">
            <div class="join-box">
                <h1>💬 Real-time Chat</h1>
                <p>Nhập tên của bạn để tham gia</p>
                <div class="input-group">
                    <input 
                        type="text" 
                        id="usernameInput" 
                        placeholder="Nhập tên người dùng..."
                        autocomplete="off"
                    >
                    <button id="joinBtn" class="btn btn-primary">Tham Gia</button>
                </div>
            </div>
        </div>

        <!-- Chat Section -->
        <div id="chatSection" class="chat-section">
            <div class="chat-wrapper">
                <!-- Sidebar - User List -->
                <div class="sidebar">
                    <div class="sidebar-header">
                        <h3>👥 Người Dùng Online</h3>
                        <span id="userCount" class="user-count">0</span>
                    </div>
                    <div id="userList" class="user-list"></div>
                    <button id="leaveBtn" class="btn btn-danger leave-btn">Thoát</button>
                </div>

                <!-- Main Chat Area -->
                <div class="main-chat">
                    <!-- Header -->
                    <div class="chat-header">
                        <div class="chat-header-content">
                            <h2 id="chatTitle">Chọn người dùng để chat</h2>
                            <p id="chatStatus" class="chat-status">--</p>
                        </div>
                        <div class="online-indicator" id="onlineIndicator"></div>
                    </div>

                    <!-- Messages Area -->
                    <div id="messagesContainer" class="messages-container">
                        <div id="systemMessage" class="system-message">
                            <p>Chào mừng! Hãy chọn một người dùng từ danh sách bên trái để bắt đầu chat.</p>
                        </div>
                    </div>

                    <!-- Typing Indicator -->
                    <div id="typingIndicator" class="typing-indicator" style="display: none;">
                        <p><span id="typingUsername"></span> đang gõ...</p>
                        <span class="dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </span>
                    </div>

                    <!-- Input Area -->
                    <div class="chat-input-area">
                        <div class="input-wrapper">
                            <input 
                                type="text"
                                id="messageInput"
                                class="message-input"
                                placeholder="Nhập tin nhắn..."
                                disabled
                            >
                            <button id="sendBtn" class="btn btn-send" disabled>
                                <span>Gửi</span>
                                <span class="send-icon">➤</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="js/client.js"></script>
</body>
</html>
